services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: discourse-clickhouse
    ports:
      - "8123:8123"   # HTTP (used by clickhouse-connect)
      - "9000:9000"   # native protocol
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: discourse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
